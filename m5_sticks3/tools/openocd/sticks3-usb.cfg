# Select USB DAP on StickS3 first. This is CMSIS-DAP, not an ST-Link protocol device.
adapter driver cmsis-dap
cmsis-dap backend usb_bulk
cmsis-dap vid_pid 0x303a 0x4004
# Override before -f: -c "set DAP_TRANSPORT jtag"
if {![info exists DAP_TRANSPORT]} { set DAP_TRANSPORT swd }
transport select $DAP_TRANSPORT
adapter speed 1000
reset_config srst_only srst_nogate
